<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My GitHub Site</title>
    <style>
        body { font-family: sans-serif; text-align: center; margin: 40px; }
        canvas { border: 1px solid #ccc; background: #fff; cursor: crosshair; }
        button { margin: 8px; padding: 8px 16px; cursor: pointer; }
        #color-picker {
            position: fixed;
            bottom: 48px;
            left: 12px;
            z-index: 200;
            width: 220px;
            max-height: 180px;
            overflow-y: auto;
            background: rgba(0,0,0,0.75);
            border-radius: 8px;
            padding: 6px;
            display: none;
        }
        #color-picker.open {
            display: block;
        }
        #color-picker .swatch {
            display: inline-block;
            width: 18px;
            height: 18px;
            margin: 2px;
            border-radius: 3px;
            cursor: pointer;
            border: 1px solid rgba(255,255,255,0.3);
        }
        #color-picker .swatch:hover {
            transform: scale(1.3);
        }
        #color-toggle {
            position: fixed;
            bottom: 12px;
            left: 12px;
            z-index: 201;
            padding: 8px 12px;
            border: none;
            border-radius: 8px;
            background: #000;
            color: #fff;
            font-size: 13px;
            font-weight: bold;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <h1>Hello! World!</h1>
    <canvas id="draw" width="600" height="400"></canvas>
    <br>
    <button id="clearBtn">Clear Canvas</button>
    <button id="clearRemoteBtn">Clear All (Remote)</button>
    <button id="color-toggle">Colors</button>
    <div id="color-picker"></div>

    <script src="pubnub.js"></script>
    <script src="q.js"></script>
    <script src="colors.js"></script>
    <script>
        const canvas = document.getElementById('draw');
        Q.setCanvas(canvas);

        // Color picker
        let activeColor = '#000';
        const colorToggle = document.getElementById('color-toggle');
        const colorPicker = document.getElementById('color-picker');
        colorToggle.style.background = activeColor;

        function setColor(hex) {
            activeColor = hex;
            colorToggle.style.background = hex;
        }

        colorToggle.addEventListener('click', (event) => {
            event.stopPropagation();
            if (typeof COLORS === 'undefined') return;
            colorPicker.classList.toggle('open');
        });
        colorPicker.addEventListener('click', (event) => event.stopPropagation());
        colorPicker.addEventListener('touchmove', (event) => event.stopPropagation(), { passive: true });
        document.addEventListener('click', (event) => {
            if (colorPicker.classList.contains('open') &&
                !(event.target.closest && event.target.closest('#color-picker, #color-toggle'))) {
                colorPicker.classList.remove('open');
            }
        });
        if (typeof COLORS !== 'undefined') {
            COLORS.forEach(([name, hex]) => {
                const swatch = document.createElement('div');
                swatch.className = 'swatch';
                swatch.style.background = hex;
                swatch.title = name;
                swatch.addEventListener('click', (event) => {
                    event.stopPropagation();
                    setColor(hex);
                    colorPicker.classList.remove('open');
                });
                colorPicker.appendChild(swatch);
            });
        }

        // Local clear button
        document.getElementById('clearBtn').addEventListener('click', () => {
            Q.clearAll();
        });

        // Remote clear button - clears canvas on all connected clients
        document.getElementById('clearRemoteBtn').addEventListener('click', async () => {
            await Q.clearAllRemote();
            Q.clearAll();
        });

        // Listen for remote draw/clear commands
        Q.connect((msg) => {
            if (msg.type === 'draw') {
                Q.drawLine(msg.x1, msg.y1, msg.x2, msg.y2, msg.color, msg.width);
            }
        });

        // Local drawing with mouse
        let drawing = false;
        let lastX = 0, lastY = 0;
        canvas.addEventListener('mousedown', (e) => {
            drawing = true;
            const r = canvas.getBoundingClientRect();
            lastX = e.clientX - r.left;
            lastY = e.clientY - r.top;
        });
        canvas.addEventListener('mousemove', (e) => {
            if (!drawing) return;
            const r = canvas.getBoundingClientRect();
            const x = e.clientX - r.left;
            const y = e.clientY - r.top;
            Q.drawLine(lastX, lastY, x, y, activeColor, 2);
            Q.drawRemote(lastX, lastY, x, y, activeColor, 2);
            lastX = x; lastY = y;
        });
        canvas.addEventListener('mouseup', () => { drawing = false; });
        canvas.addEventListener('mouseleave', () => { drawing = false; });
    </script>
</body>
</html>
