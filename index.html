<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Minecraft 3D — Creative Voxel Sandbox</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><rect width='16' height='16' fill='%23795c34'/><rect width='16' height='5' fill='%235f9c3a'/></svg>">
<link rel="stylesheet" href="style.css">
</head>
<body>
<canvas id="game"></canvas>

<div id="crosshair"></div>

<div id="hudTop">
    <div id="itemName"></div>
</div>

<div id="hotbar"></div>

<div id="debug" class="hidden"></div>

<div id="toast" class="hidden"></div>

<div id="touchControls">
    <div id="stickBase"><div id="stickKnob"></div></div>
    <div id="touchButtons">
        <button class="tbtn" data-act="jump">JUMP</button>
        <button class="tbtn" data-act="break">BREAK</button>
        <button class="tbtn" data-act="place">PLACE</button>
        <button class="tbtn small" data-act="fly">FLY</button>
    </div>
</div>

<div id="loading">
    <h1>MINECRAFT 3D</h1>
    <div class="bar"><i id="loadBar"></i></div>
    <p id="loadText">Loading</p>
    <button id="playBtn" hidden>Play</button>
</div>

<div id="menu" class="hidden">
    <div class="panel">
        <h2>Game Menu</h2>
        <div class="rows">
            <div class="row">
                <span>Render distance</span>
                <input type="range" id="setRender" min="3" max="12" step="1" value="7">
                <b id="valRender">7</b>
            </div>
            <div class="row">
                <span>FOV</span>
                <input type="range" id="setFov" min="60" max="110" step="1" value="75">
                <b id="valFov">75</b>
            </div>
            <div class="row">
                <span>Sensitivity</span>
                <input type="range" id="setSens" min="20" max="300" step="5" value="100">
                <b id="valSens">1.00</b>
            </div>
            <div class="row">
                <span>Day speed</span>
                <input type="range" id="setDay" min="0" max="40" step="1" value="10">
                <b id="valDay">1x</b>
            </div>
            <div class="row">
                <span>Volume</span>
                <input type="range" id="setVol" min="0" max="100" step="5" value="50">
                <b id="valVol">50</b>
            </div>
        </div>
        <div class="btnRow">
            <button id="btnResume">Back to Game</button>
            <button id="btnNewWorld">New World</button>
            <button id="btnHome">GitHub</button>
        </div>
        <div class="help">
            WASD move &middot; Space jump &middot; Shift down &middot; F fly &middot; Ctrl sprint<br>
            1-9 or scroll select &middot; Left click break &middot; Right click place<br>
            E block list &middot; Esc menu &middot; F3 debug
        </div>
    </div>
</div>

<div id="picker" class="hidden">
    <div class="panel wide">
        <h2>Blocks</h2>
        <div id="pickerGrid"></div>
        <div class="btnRow">
            <button id="btnPickerClose">Close</button>
            <button id="btnMobSheep">Spawn Sheep</button>
            <button id="btnMobCow">Spawn Cow</button>
            <button id="btnMobPig">Spawn Pig</button>
            <button id="btnMobChicken">Spawn Chicken</button>
        </div>
    </div>
</div>

<script type="importmap">
{ "imports": { "three": "./vendor/three.module.js" } }
</script>
<script type="module" src="js/main.js"></script>
</body>
</html>
